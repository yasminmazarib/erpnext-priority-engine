name: Integration + UI Tests

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =====================================
  # API Tests (Mock + Coverage) ✅
  # =====================================
  api-tests:
    name: API Tests (Mock + Codecov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run API tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =====================================
  # UI Tests (Playwright + Ngrok) ✅
  # =====================================
  ui-tests:
    name: UI Tests (Playwright + Ngrok)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Start backend (FastAPI)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      # ---------- Ngrok ----------
      - name: Install ngrok
        run: npm install -g ngrok

      - name: Configure ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok
        run: |
          ngrok http 8000 --log=stdout > ngrok.log &
          sleep 10

      - name: Extract ngrok URL
        run: |
          echo "NGROK_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.ngrok-free\.app' ngrok.log | head -n 1)" >> $GITHUB_ENV

      # ---------- Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start frontend (Next.js)
        working-directory: frontend
        run: |
          npm run dev &
          sleep 10

      - name: Run Playwright UI tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NGROK_URL }}
        run: npx playwright test
