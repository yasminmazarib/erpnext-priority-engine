name: Integration + UI Tests

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ===============================
  # Backend Integration Tests
  # ===============================
  backend-integration-tests:
    name: Backend Integration Tests (ERPNext)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend integration tests
        env:
          PYTHONPATH: .
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: pytest backend/tests/api_integration_local -v
        continue-on-error: true


  # ===============================
  # UI Tests (Playwright + NGROK)
  # ===============================
  ui-tests:
    name: UI Tests (Playwright + Ngrok)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend (FastAPI)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      # ---------- NGROK ----------
      - name: Install ngrok
        run: npm install -g ngrok

      - name: Configure ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok (backend)
        run: |
          ngrok http 8000 --log=stdout > ngrok.log &
          sleep 10

      - name: Extract ngrok public URL
        run: |
          echo "NGROK_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.ngrok-free\.app' ngrok.log | head -n 1)" >> $GITHUB_ENV

      # ---------- Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend (Next.js)
        working-directory: frontend
        run: |
          npm run start &
          sleep 10

      # ---------- Playwright ----------
      - name: Run Playwright UI tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NGROK_URL }}
        run: npx playwright test