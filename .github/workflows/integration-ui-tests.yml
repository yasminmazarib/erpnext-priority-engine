name: Integration + UI Tests with Allure

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-integration-tests:
    name: Backend Integration Tests (ERPNext)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Run backend integration tests
        env:
          PYTHONPATH: .
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: pytest backend/tests/api_integration_local -v
        continue-on-error: true

  ui-and-allure-tests:
    name: UI Tests (Playwright + Ngrok + Allure)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (Playwright + Allure)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest
          pip install playwright
          python -m playwright install --with-deps

      # ---------- Start Backend ----------
      - name: Start backend (FastAPI)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      # ---------- Ngrok ----------
      - name: Install ngrok
        run: npm install -g ngrok

      - name: Configure ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok
        run: |
          ngrok http 8000 &
          sleep 10

      # ---------- Node / Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers (JS)
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright UI tests (JS)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx playwright test

      # ---------- Pytest UI + Backend + Allure ----------
      - name: Run pytest tests with Allure
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api \
                 backend/tests/api_integration_local \
                 frontend/ui_tests_python \
                 --alluredir=allure-results

      # ---------- Upload Allure Results ----------
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
