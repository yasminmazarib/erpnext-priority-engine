name: CI - API + UI Tests

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------- API UNIT / MOCK ----------------
  api-tests:
    name: API Tests (Mock + Codecov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run API mock tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api_mock \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: api
          name: api-tests
          fail_ci_if_error: true
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: api
          name: api-tests
          fail_ci_if_error: true
