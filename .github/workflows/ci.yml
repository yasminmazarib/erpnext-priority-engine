name: CI - API + UI Tests

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
# ================= API MOCK + CODECOV =================
  api-tests:
    name: API Tests (Mock + Codecov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run API mock tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api_mock \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: api
          name: api-tests
          fail_ci_if_error: true

# ================= UI + PLAYWRIGHT + NGROK =================
  ui-tests:
    name: UI Tests (Playwright + ngrok)
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - uses: actions/checkout@v4

      # ---------- Node / Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev &
          sleep 15

      # ---------- ngrok ----------
      - name: Install ngrok + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok tunnel
        run: |
          ngrok http 3000 > ngrok.log &
          sleep 10

      - name: Extract ngrok URL
        run: |
          NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "BASE_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "NGROK URL = $NGROK_URL"

      # ---------- Playwright ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install

      - name: Run UI tests
        working-directory: frontend
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          python ui_tests_python/test_e2e_user_journey.py
