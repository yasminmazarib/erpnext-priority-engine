name: CI - API + UI Tests

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------- API UNIT / MOCK ----------------
  api-tests:
    name: API Tests (Mock)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Run API mock tests
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api_mock -v


  # ---------------- API INTEGRATION ----------------
  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Run API integration tests
        env:
          PYTHONPATH: .
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: |
          pytest backend/tests/api_integration_local -v


  # ---------------- UI E2E ----------------
  ui-tests:
    name: UI Tests (Python + Playwright + ngrok)
    runs-on: ubuntu-latest
    needs: api-integration-tests

    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start frontend (Next.js)
        working-directory: frontend
        run: |
          npm run dev &
          sleep 15

      # ---------- ngrok ----------
      - name: Install ngrok + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok tunnel
        run: |
          ngrok http 3000 > ngrok.log &
          sleep 10

      - name: Extract ngrok URL
        run: |
          NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "BASE_URL=$NGROK_URL" >> $GITHUB_ENV
          echo "Using BASE_URL=$NGROK_URL"

      # ---------- UI Tests ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI test dependencies
        run: |
          pip install playwright
          playwright install

      - name: Run UI E2E tests
        working-directory: frontend
        run: python ui_tests_python/test_e2e_user_journey.py
