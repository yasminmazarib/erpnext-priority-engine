name: API + Integration + UI Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:

  # =========================
  # API UNIT / MOCK TESTS
  # =========================
  api-mock-tests:
    name: API Unit / Mock Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API unit tests (mocked)
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/api_mock -v


  # =========================
  # BACKEND INTEGRATION TESTS
  # =========================
  backend-integration-tests:
    name: Backend Integration Tests (ERPNext)
    runs-on: ubuntu-latest
    needs: api-mock-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend integration tests
        env:
          PYTHONPATH: .
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: |
          pytest backend/tests/api_integration_local -v
        continue-on-error: true


  # =========================
  # UI TESTS – PLAYWRIGHT
  # =========================
  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: api-mock-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright UI tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test
